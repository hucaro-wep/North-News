
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>NORTH NEWS | صحيفة المملكة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./config.js"></script>

<style>
:root {
  --bg: #07111f;
  --panel: #0c1b2d;
  --panel2: #10243a;
  --blue: #38bdf8;
  --light-blue: #bfdbfe;
  --text: #f1f7ff;
  --muted: #8da5bf;
  --border: rgba(148, 187, 220, .16);
  --radius: 17px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at top, rgba(56,189,248,.09), transparent 42%),
    var(--bg);
  color: var(--text);
  font-family: "Cairo", sans-serif;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 3px;
}

a {
  color: inherit;
  text-decoration: none;
}

.container {
  width: min(100% - 28px, 920px);
  margin-inline: auto;
}

header {
  padding: 24px 0 18px;
}

.topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
}

.brand-icon {
  width: 45px;
  height: 45px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  border-radius: 14px;
  color: var(--blue);
  background: rgba(56,189,248,.10);
  border: 1px solid rgba(56,189,248,.25);
  font-size: 23px;
  font-weight: 900;
}

.brand-name {
  margin: 0;
  font-size: 21px;
  line-height: 1.35;
  font-weight: 900;
  letter-spacing: .5px;
}

.brand-subtitle {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
}

.live {
  display: flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--border);
  background: rgba(12,27,45,.8);
  color: var(--light-blue);
  padding: 7px 11px;
  border-radius: 30px;
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
}

.live-dot {
  width: 7px;
  height: 7px;
  background: #38d996;
  border-radius: 50%;
  box-shadow: 0 0 10px rgba(56,217,150,.55);
}

.masthead {
  text-align: center;
  padding: 24px 0 20px;
}

.masthead h1 {
  margin: 0;
  font-size: clamp(30px, 7vw, 47px);
  font-weight: 900;
  letter-spacing: 1px;
  line-height: 1.35;
}

.masthead h1 span {
  color: var(--blue);
}

.masthead p {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
}

.masthead-line {
  width: 75px;
  height: 3px;
  border-radius: 10px;
  background: var(--blue);
  margin: 15px auto 0;
}

.search-area {
  margin-bottom: 19px;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 0 14px;
  transition: border-color .2s;
}

.search-box:focus-within {
  border-color: rgba(56,189,248,.6);
}

.search-icon {
  font-size: 19px;
  color: var(--blue);
}

.search-box input {
  width: 100%;
  min-width: 0;
  padding: 15px 0;
  color: var(--text);
  background: transparent;
  border: 0;
  outline: none;
  font-size: 14px;
}

.search-box input::placeholder {
  color: #7189a4;
}

.clear-search {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 19px;
  padding: 4px;
}

.section-heading {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 23px 0 13px;
}

.section-heading::before {
  content: "";
  width: 4px;
  height: 23px;
  border-radius: 8px;
  background: var(--blue);
}

.section-heading h2 {
  margin: 0;
  font-size: 17px;
  font-weight: 900;
}

.section-heading small {
  color: var(--muted);
  font-size: 11px;
  font-weight: 600;
}

.featured {
  display: none;
  overflow: hidden;
  border: 1px solid rgba(56,189,248,.24);
  background: linear-gradient(135deg, #102b43, #0a192a 75%);
  border-radius: var(--radius);
  margin-bottom: 22px;
  cursor: pointer;
  transition: transform .2s, border-color .2s;
}

.featured:hover {
  border-color: rgba(56,189,248,.55);
  transform: translateY(-2px);
}

.featured-image {
  width: 100%;
  height: 210px;
  display: none;
  object-fit: cover;
  background: #10243a;
}

.featured-image.visible {
  display: block;
}

.featured-content {
  padding: 19px;
}

.featured-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--blue);
  background: rgba(56,189,248,.1);
  border: 1px solid rgba(56,189,248,.18);
  border-radius: 7px;
  padding: 5px 9px;
  font-size: 10px;
  font-weight: 900;
}

.featured h3 {
  margin: 12px 0 8px;
  font-size: 21px;
  font-weight: 900;
  line-height: 1.65;
  overflow-wrap: anywhere;
}

.featured p {
  color: #a8bdd2;
  font-size: 13px;
  line-height: 1.9;
  margin: 0;
  overflow-wrap: anywhere;
}

.article-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 9px;
  color: var(--muted);
  font-size: 11px;
  margin-top: 13px;
}

.category-tag {
  display: inline-flex;
  align-items: center;
  color: var(--light-blue);
  background: rgba(56,189,248,.09);
  border: 1px solid rgba(56,189,248,.17);
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 800;
}

.filters {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 1px 9px;
  scrollbar-width: thin;
  scrollbar-color: #1b3d5a transparent;
}

.filter-btn {
  flex-shrink: 0;
  padding: 8px 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: #a9bfd4;
  background: var(--panel);
  font-size: 12px;
  font-weight: 700;
  transition: .2s;
}

.filter-btn:hover {
  border-color: rgba(56,189,248,.45);
  color: var(--text);
}

.filter-btn.active {
  background: var(--blue);
  color: #06111f;
  border-color: var(--blue);
  font-weight: 900;
}

.news-list {
  display: flex;
  flex-direction: column;
  gap: 11px;
  padding-bottom: 25px;
}

.news-card {
  display: grid;
  grid-template-columns: 104px minmax(0, 1fr);
  gap: 14px;
  align-items: center;
  padding: 12px;
  border-radius: 15px;
  border: 1px solid var(--border);
  background: linear-gradient(110deg, rgba(12,27,45,.96), rgba(10,23,39,.94));
  cursor: pointer;
  transition: transform .2s, border-color .2s, background .2s;
}

.news-card:hover {
  transform: translateY(-2px);
  border-color: rgba(56,189,248,.38);
  background: #0d2034;
}

.news-image {
  width: 104px;
  height: 104px;
  object-fit: cover;
  border-radius: 11px;
  background: var(--panel2);
}

.news-image-placeholder {
  width: 104px;
  height: 104px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: linear-gradient(145deg, #102d47, #0b192a);
  border: 1px solid var(--border);
  color: var(--blue);
  font-size: 27px;
  font-weight: 900;
}

.news-body {
  min-width: 0;
}

.news-topline {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 7px;
  margin-bottom: 6px;
}

.news-card h3 {
  margin: 0;
  font-size: 15px;
  line-height: 1.7;
  font-weight: 900;
  overflow-wrap: anywhere;
}

.news-card p {
  margin: 6px 0 0;
  color: #91a8c0;
  font-size: 12px;
  line-height: 1.8;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.news-card .article-meta {
  margin-top: 8px;
  gap: 8px;
}

.empty-state,
.loading-state,
.error-state {
  text-align: center;
  padding: 35px 18px;
  border: 1px dashed var(--border);
  border-radius: 15px;
  background: rgba(12,27,45,.6);
  color: var(--muted);
  line-height: 1.9;
}

.empty-icon {
  font-size: 32px;
  margin-bottom: 8px;
}

.retry-btn {
  margin-top: 12px;
  padding: 9px 16px;
  border: 0;
  border-radius: 9px;
  background: var(--blue);
  color: #06111f;
  font-weight: 900;
}

footer {
  margin-top: 8px;
  padding: 23px 0 28px;
  border-top: 1px solid var(--border);
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  line-height: 2;
}

footer strong {
  color: var(--light-blue);
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  padding: 18px 12px;
  background: rgba(2,8,16,.86);
  backdrop-filter: blur(9px);
  overflow-y: auto;
  align-items: flex-start;
  justify-content: center;
}

.modal.open {
  display: flex;
}

.modal-panel {
  position: relative;
  width: min(100%, 690px);
  margin: auto;
  overflow: hidden;
  border-radius: 19px;
  border: 1px solid rgba(56,189,248,.22);
  background: #091827;
  box-shadow: 0 25px 90px rgba(0,0,0,.45);
}

.modal-close {
  position: absolute;
  z-index: 2;
  top: 11px;
  left: 11px;
  width: 39px;
  height: 39px;
  display: grid;
  place-items: center;
  border-radius: 11px;
  border: 1px solid rgba(255,255,255,.16);
  color: white;
  background: rgba(3,10,18,.8);
  font-size: 23px;
}

.modal-image {
  display: none;
  width: 100%;
  max-height: 330px;
  object-fit: cover;
  background: var(--panel2);
}

.modal-image.visible {
  display: block;
}

.modal-content {
  padding: 21px;
}

.modal-title {
  margin: 12px 0 9px;
  font-size: clamp(20px, 5vw, 28px);
  line-height: 1.65;
  font-weight: 900;
  overflow-wrap: anywhere;
}

.modal-date {
  color: var(--muted);
  font-size: 11px;
  margin-bottom: 17px;
}

.modal-excerpt {
  color: var(--light-blue);
  font-weight: 700;
  font-size: 14px;
  line-height: 2;
  margin: 0 0 15px;
  overflow-wrap: anywhere;
}

.modal-article-content {
  color: #d6e3f1;
  font-size: 14px;
  line-height: 2.15;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.modal-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 23px;
  padding-top: 17px;
  border-top: 1px solid var(--border);
}

.action-btn {
  flex: 1;
  min-width: 120px;
  padding: 11px 13px;
  border-radius: 10px;
  border: 1px solid var(--border);
  color: var(--light-blue);
  background: var(--panel);
  font-size: 12px;
  font-weight: 800;
}

.action-btn.primary {
  color: #06111f;
  background: var(--blue);
  border-color: var(--blue);
}

.toast {
  position: fixed;
  bottom: 22px;
  left: 50%;
  z-index: 2000;
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  padding: 11px 17px;
  border: 1px solid rgba(56,189,248,.3);
  border-radius: 11px;
  background: #10243a;
  color: var(--text);
  font-size: 12px;
  font-weight: 800;
  transition: .25s;
  max-width: calc(100% - 28px);
  text-align: center;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (min-width: 650px) {
  .featured {
    display: grid;
    grid-template-columns: 42% minmax(0, 1fr);
    align-items: stretch;
  }

  .featured-image,
  .featured-image.visible {
    display: block;
    height: 100%;
    min-height: 230px;
  }

  .featured-content {
    padding: 24px;
  }

  .news-card {
    grid-template-columns: 125px minmax(0, 1fr);
    padding: 14px;
  }

  .news-image,
  .news-image-placeholder {
    width: 125px;
    height: 112px;
  }
}

@media (max-width: 390px) {
  .container {
    width: calc(100% - 20px);
  }

  .news-card {
    grid-template-columns: 82px minmax(0, 1fr);
    gap: 10px;
    padding: 9px;
  }

  .news-image,
  .news-image-placeholder {
    width: 82px;
    height: 88px;
  }

  .news-card h3 {
    font-size: 13px;
  }

  .news-card p {
    font-size: 11px;
  }

  .featured-content {
    padding: 15px;
  }
}
</style>
</head>

<body>

<header>
  <div class="container">
    <div class="topline">
      <div class="brand">
        <div class="brand-icon">N</div>
        <div>
          <h2 class="brand-name">NORTH NEWS</h2>
          <div class="brand-subtitle">N.R.H OFFICIAL NEWSPAPER</div>
        </div>
      </div>

      <div class="live">
        <span class="live-dot"></span>
        أخبار المملكة
      </div>
    </div>

    <div class="masthead">
      <h1>صحيفة <span>المملكة</span></h1>
      <p>المصدر الرسمي لأخبار وقرارات مملكة الشمال</p>
      <div class="masthead-line"></div>
    </div>
  </div>
</header>

<main class="container">

  <div class="search-area">
    <label class="search-box">
      <span class="search-icon">⌕</span>
      <input
        id="searchInput"
        type="search"
        placeholder="ابحث عن خبر أو قرار أو نقابة..."
        autocomplete="off"
        aria-label="البحث في الأخبار"
      >
      <button class="clear-search" id="clearSearch" type="button" aria-label="مسح البحث" hidden>×</button>
    </label>
  </div>

  <section id="featuredSection" hidden>
    <div class="section-heading">
      <h2>الخبر المميز</h2>
    </div>
    <article class="featured" id="featuredCard"></article>
  </section>

  <section>
    <div class="section-heading">
      <h2>آخر الأخبار</h2>
    </div>

    <div class="filters" id="categoryFilters">
      <button class="filter-btn active" type="button" data-category="الكل">الكل</button>
      <button class="filter-btn" type="button" data-category="قرارات ملكية">قرارات ملكية</button>
      <button class="filter-btn" type="button" data-category="النقابات">النقابات</button>
      <button class="filter-btn" type="button" data-category="تعيينات">تعيينات</button>
      <button class="filter-btn" type="button" data-category="إعلانات">إعلانات</button>
      <button class="filter-btn" type="button" data-category="أخرى">أخرى</button>
    </div>

    <div id="newsList" class="news-list">
      <div class="loading-state">جارٍ تحميل أخبار المملكة...</div>
    </div>
  </section>

</main>

<footer>
  <div class="container">
    <strong>NORTH NEWS</strong><br>
    صحيفة مملكة الشمال الرسمية<br>
    <span>N.R.H OFFICIAL</span>
  </div>
</footer>

<div class="modal" id="articleModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-panel">
    <button class="modal-close" id="closeModal" type="button" aria-label="إغلاق">×</button>
    <img class="modal-image" id="modalImage" alt="">
    <div class="modal-content">
      <span class="category-tag" id="modalCategory"></span>
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-date" id="modalDate"></div>
      <p class="modal-excerpt" id="modalExcerpt"></p>
      <div class="modal-article-content" id="modalContent"></div>

      <div class="modal-actions">
        <button class="action-btn primary" id="copyArticle" type="button">نسخ الخبر</button>
        <button class="action-btn" id="shareArticle" type="button">مشاركة الخبر</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";

  const $ = (id) => document.getElementById(id);

  let db = null;
  let articles = [];
  let activeCategory = "الكل";
  let activeArticle = null;
  let toastTimer = null;

  // توحيد الحروف العربية لتسهيل البحث
  function normalizeArabic(value) {
    return String(value ?? "")
      .normalize("NFKC")
      .replace(/[\u064B-\u065F\u0670\u0640]/g, "")
      .replace(/[أإآٱ]/g, "ا")
      .replace(/[هة]/g, "ه")
      .replace(/ى/g, "ي")
      .toLowerCase()
      .trim();
  }

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, (char) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function formatDate(value) {
    if (!value) return "التاريخ غير محدد";

    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return "التاريخ غير محدد";

    try {
      return new Intl.DateTimeFormat("ar-EG", {
        year: "numeric",
        month: "long",
        day: "numeric"
      }).format(date);
    } catch {
      return date.toLocaleDateString();
    }
  }

  function articleDate(article) {
    return article.published_at || article.created_at || "";
  }

  function articleText(article) {
    return [
      article.title,
      article.excerpt,
      article.content,
      article.category
    ].filter(Boolean).join(" ");
  }

  function showToast(message) {
    const toast = $("toast");
    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove("show");
    }, 2400);
  }

  function placeholderImage() {
    return `
      <div class="news-image-placeholder" aria-label="لا توجد صورة">
        N
      </div>
    `;
  }

  function imageHTML(url, className, alt = "صورة الخبر") {
    if (!url) {
      return placeholderImage();
    }

    return `
      <img
        class="${className}"
        src="${escapeHTML(url)}"
        alt="${escapeHTML(alt)}"
        loading="lazy"
        onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'news-image-placeholder',textContent:'N'}))"
      >
    `;
  }

  function categoryHTML(category) {
    if (!category) return "";
    return `<span class="category-tag">${escapeHTML(category)}</span>`;
  }

  function renderFeatured(article) {
    const section = $("featuredSection");
    const card = $("featuredCard");

    if (!article) {
      section.hidden = true;
      card.innerHTML = "";
      return;
    }

    section.hidden = false;

    const image = article.image_url
      ? `<img class="featured-image visible" src="${escapeHTML(article.image_url)}" alt="${escapeHTML(article.title)}" loading="lazy" onerror="this.style.display='none'">`
      : `<div class="featured-image" style="display:grid;place-items:center;color:var(--blue);font-size:45px;font-weight:900">N</div>`;

    card.innerHTML = `
      ${image}
      <div class="featured-content">
        <span class="featured-label">✦ الخبر المميز</span>
        <h3>${escapeHTML(article.title || "خبر من أخبار المملكة")}</h3>
        <p>${escapeHTML(article.excerpt || "")}</p>
        <div class="article-meta">
          ${categoryHTML(article.category)}
          <span>${escapeHTML(formatDate(articleDate(article)))}</span>
        </div>
      </div>
    `;

    card.onclick = () => openArticle(article);
  }

  function renderNewsCard(article) {
    const image = article.image_url
      ? imageHTML(article.image_url, "news-image", article.title || "صورة الخبر")
      : placeholderImage();

    return `
      <article class="news-card" tabindex="0" role="button"
        aria-label="فتح الخبر: ${escapeHTML(article.title || "")}"
        data-article-id="${escapeHTML(article.id)}">
        ${image}
        <div class="news-body">
          <div class="news-topline">
            ${categoryHTML(article.category)}
          </div>
          <h3>${escapeHTML(article.title || "بدون عنوان")}</h3>
          <p>${escapeHTML(article.excerpt || article.content || "")}</p>
          <div class="article-meta">
            <span>${escapeHTML(formatDate(articleDate(article)))}</span>
            <span>قراءة الخبر ←</span>
          </div>
        </div>
      </article>
    `;
  }

  function getFilteredArticles() {
    const query = normalizeArabic($("searchInput").value);

    return articles.filter((article) => {
      const categoryMatch =
        activeCategory === "الكل" ||
        article.category === activeCategory;

      const searchMatch =
        !query ||
        normalizeArabic(articleText(article)).includes(query);

      return categoryMatch && searchMatch;
    });
  }

  function render() {
    const list = $("newsList");
    const filtered = getFilteredArticles();
    const query = $("searchInput").value.trim();

    $("clearSearch").hidden = !query;

    const featuredArticle = articles.find((article) => article.is_featured);

    // إخفاء الخبر المميز أثناء البحث أو عند اختيار تصنيف مختلف
    const showFeatured =
      !query &&
      activeCategory === "الكل" &&
      Boolean(featuredArticle);

    renderFeatured(showFeatured ? featuredArticle : null);

    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">⌕</div>
          <strong>لا توجد أخبار مطابقة</strong>
          <div>جرّب كلمة بحث أخرى أو اختر تصنيفًا مختلفًا.</div>
        </div>
      `;
      return;
    }

    list.innerHTML = filtered.map(renderNewsCard).join("");

    list.querySelectorAll(".news-card").forEach((card) => {
      const open = () => {
        const article = articles.find(
          (item) => String(item.id) === card.dataset.articleId
        );
        if (article) openArticle(article);
      };

      card.addEventListener("click", open);
      card.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          open();
        }
      });
    });
  }

  function openArticle(article) {
    activeArticle = article;

    $("modalCategory").textContent = article.category || "أخبار المملكة";
    $("modalTitle").textContent = article.title || "بدون عنوان";
    $("modalDate").textContent = formatDate(articleDate(article));
    $("modalExcerpt").textContent = article.excerpt || "";
    $("modalContent").textContent = article.content || "";

    const image = $("modalImage");

    if (article.image_url) {
      image.src = article.image_url;
      image.alt = article.title || "صورة الخبر";
      image.classList.add("visible");
      image.onerror = () => image.classList.remove("visible");
    } else {
      image.removeAttribute("src");
      image.classList.remove("visible");
    }

    $("articleModal").classList.add("open");
    document.body.style.overflow = "hidden";
    $("closeModal").focus();
  }

  function closeArticle() {
    $("articleModal").classList.remove("open");
    document.body.style.overflow = "";
    activeArticle = null;
  }

  function articleToText(article) {
    return [
      article.title || "",
      article.category ? `التصنيف: ${article.category}` : "",
      `التاريخ: ${formatDate(articleDate(article))}`,
      "",
      article.excerpt || "",
      "",
      article.content || ""
    ].filter((line, index, array) => {
      return line !== "" || (index > 0 && array[index - 1] !== "");
    }).join("\n").trim();
  }

  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        textarea.style.pointerEvents = "none";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();

        const copied = document.execCommand("copy");
        textarea.remove();

        if (!copied) throw new Error("تعذر النسخ");
      }

      showToast("تم نسخ الخبر بنجاح");
    } catch (error) {
      showToast("تعذر النسخ تلقائيًا على هذا الجهاز");
    }
  }

  async function shareArticle() {
    if (!activeArticle) return;

    const text = articleToText(activeArticle);

    if (navigator.share) {
      try {
        await navigator.share({
          title: activeArticle.title || "NORTH NEWS",
          text
        });
      } catch (error) {
        if (error && error.name !== "AbortError") {
          showToast("تعذرت المشاركة");
        }
      }
    } else {
      await copyText(text);
      showToast("تم نسخ الخبر لمشاركته");
    }
  }

  async function loadNews() {
    const list = $("newsList");

    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      list.innerHTML = `
        <div class="error-state">
          تعذر تحميل مكتبة الاتصال بقاعدة البيانات.
          <br>تأكد من اتصال الإنترنت ثم أعد تحميل الصفحة.
          <br>
          <button class="retry-btn" id="retryLoad" type="button">إعادة المحاولة</button>
        </div>
      `;
      $("retryLoad").addEventListener("click", loadNews);
      return;
    }

    if (
      !window.NORTH_SUPABASE_URL ||
      !window.NORTH_SUPABASE_ANON_KEY
    ) {
      list.innerHTML = `
        <div class="error-state">
          بيانات اتصال Supabase غير موجودة.
          <br>تأكد من أن ملف config.js موجود بجوار index.html.
        </div>
      `;
      return;
    }

    list.innerHTML = '<div class="loading-state">جارٍ تحميل أخبار المملكة...</div>';

    try {
      if (!db) {
        db = window.supabase.createClient(
          window.NORTH_SUPABASE_URL,
          window.NORTH_SUPABASE_ANON_KEY
        );
      }

      const { data, error } = await db
        .from("north_news_articles")
        .select("id,title,excerpt,content,category,image_url,is_featured,published_at,created_at")
        .eq("status", "published")
        .order("is_featured", { ascending: false })
        .order("published_at", { ascending: false });

      if (error) throw error;

      articles = Array.isArray(data) ? data : [];
      render();

      if (articles.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">✦</div>
            <strong>لا توجد أخبار منشورة حاليًا</strong>
            <div>ستظهر الأخبار هنا عند نشرها من لوحة الإدارة.</div>
          </div>
        `;
      }
    } catch (error) {
      console.error("NORTH NEWS loading error:", error);

      list.innerHTML = `
        <div class="error-state">
          تعذر تحميل الأخبار من قاعدة البيانات.
          <br>تأكد من اتصال الإنترنت وإعدادات Supabase وصلاحيات قراءة الأخبار المنشورة.
          <br>
          <button class="retry-btn" id="retryLoad" type="button">إعادة المحاولة</button>
        </div>
      `;

      $("retryLoad").addEventListener("click", loadNews);
    }
  }

  $("searchInput").addEventListener("input", render);

  $("clearSearch").addEventListener("click", () => {
    $("searchInput").value = "";
    render();
    $("searchInput").focus();
  });

  $("categoryFilters").addEventListener("click", (event) => {
    const button = event.target.closest("[data-category]");
    if (!button) return;

    activeCategory = button.dataset.category;

    $("categoryFilters")
      .querySelectorAll(".filter-btn")
      .forEach((item) => {
        item.classList.toggle("active", item === button);
      });

    render();
  });

  $("closeModal").addEventListener("click", closeArticle);

  $("articleModal").addEventListener("click", (event) => {
    if (event.target === $("articleModal")) {
      closeArticle();
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && $("articleModal").classList.contains("open")) {
      closeArticle();
    }
  });

  $("copyArticle").addEventListener("click", () => {
    if (activeArticle) {
      copyText(articleToText(activeArticle));
    }
  });

  $("shareArticle").addEventListener("click", shareArticle);

  loadNews();
})();
</script>

</body>
</html>
